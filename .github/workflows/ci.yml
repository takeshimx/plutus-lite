name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# api/、frontend/、infra/ はまだ無い。各ジョブは対象のファイルが無ければ
# 検査の手順を飛ばして成功する。雛形が入った時点で自動的に検査が始まる。

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: exists
        working-directory: .
        run: echo "found=$([ -f api/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.found == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - if: steps.exists.outputs.found == 'true'
        run: uv sync --locked
      - if: steps.exists.outputs.found == 'true'
        run: uv run ruff check . && uv run ruff format --check .
      - if: steps.exists.outputs.found == 'true'
        run: uv run mypy app
      - if: steps.exists.outputs.found == 'true'
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: exists
        working-directory: .
        run: echo "found=$([ -f frontend/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.found == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.exists.outputs.found == 'true'
        run: npm ci
      - if: steps.exists.outputs.found == 'true'
        run: npm run lint && npm run typecheck
      - if: steps.exists.outputs.found == 'true'
        run: npm test
      - if: steps.exists.outputs.found == 'true'
        run: npm run build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: exists
        working-directory: .
        run: echo "found=$(ls infra/*.tf >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.found == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - if: steps.exists.outputs.found == 'true'
        run: terraform fmt -check -recursive
      # バックエンドに接続せず構文だけ確認する。plan はP4で別のワークフローに置く
      - if: steps.exists.outputs.found == 'true'
        run: terraform init -backend=false && terraform validate

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action がPRのコミット一覧を読むため
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks(秘匿情報の検出)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: semgrep(静的解析)
        run: |
          pipx run semgrep scan --config p/default --error --metrics=off

  # 評価ゲート(P5)。golden set の整合性は常に検査する。
  # eval/gate.json で機能が有効なら、模擬版の Firebase Auth と BigQuery、API を起動してから実行する
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: cd eval && uv sync --locked
      - run: cd api && uv sync --locked
      - run: scripts/eval_run.sh
      - if: failure()
        run: tail -n 100 .eval-logs/*.log || true

  # E2E(P8、Issue #31)。評価ゲートと同じ模擬版と API を起動し、画面を Playwright で操作する
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd eval && uv sync --locked
      - run: cd api && uv sync --locked
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: scripts/e2e_run.sh
      - if: failure()
        run: tail -n 100 .eval-logs/*.log || true

  # ブランチ保護で必須にするのはこのジョブだけ。
  # ジョブを増減しても保護ルールを書き換えずに済む。
  ci-ok:
    if: always()
    needs: [api, frontend, infra, security, eval, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "CIの一部が失敗した"; exit 1
          fi
